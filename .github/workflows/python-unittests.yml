name: Unittests

on:
  push:
    branches:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  unittests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['11', '12', '13']
        cfg:
          - { os: windows-2025-vs2026, architecture: x64, whl: 'win_amd64' }
          - { os: windows-11-vs2026-arm, architecture: arm64, whl: 'win_arm64' }
          - { os: macos-15-intel, architecture: x64, whl: 'macosx_x86_64' }
          - { os: macos-15, architecture: arm64, whl: 'macosx_arm64' }
          - { os: ubuntu-24.04, architecture: x64, whl: 'manylinux_x86_64' }

    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.${{ matrix.cfg.python-version }}'
        architecture: ${{ matrix.cfg.architecture }}

    - name: Build and Test
      run: |
        pip install cibuildwheel~=4.1
        cibuildwheel --only cp3${{ matrix.python-version }}-${{ matrix.cfg.whl }} --output-dir dist .

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cp3${{ matrix.python-version }}-${{ matrix.cfg.whl }}
        path: dist/*
