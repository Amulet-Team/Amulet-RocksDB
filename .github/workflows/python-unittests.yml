# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unittests

on:
  push:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  unittests:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-15, python-version: '3.12', architecture: arm64 }
          - { os: macos-15, python-version: '3.12', architecture: x64 }
          - { os: windows-2025, python-version: '3.12', architecture: x64 }
          - { os: ubuntu-24.04, python-version: '3.12', architecture: x64 }

    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.config.python-version }}
        architecture: ${{ matrix.config.architecture }}
        
    - name: Build
      run: |
        pip install -v .[dev]
        
    - name: Test with unittest
      run: python -m unittest discover -v -s tests
