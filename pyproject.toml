[build-system]
requires = [
    "setuptools>=42",
    "versioneer",
    "packaging",
]
build-backend = "build_requires"
backend-path = [""]

[project]
name = "amulet-rocksdb"
authors = [
    {name = "James Clare"},
]
description = "A pybind11 wrapper for Facebook's RocksDB."
dynamic = ["version", "readme", "dependencies"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "setuptools>=42",
    "types-setuptools",
    "versioneer",
    "types-versioneer",
    "packaging",
    "pybind11_stubgen>=2.5.4",
    "black>=22.3",
    "isort",
    "autoflake",
    "mypy",
    "types-pyinstaller",
]

[project.urls]
Homepage = "https://www.amuletmc.com"
Repository = "https://github.com/Amulet-Team/Amulet-RocksDB"
Issues = "https://github.com/Amulet-Team/Amulet-RocksDB/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src/amulet"]

[tool.setuptools.package-data]
"*" = [
    "**/*.dll",
    "**/*.so",
    "**/*.dylib",
    "**/*.lib",
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[project.entry-points.pyinstaller40]
hook-dirs = "rocksdb.__pyinstaller:get_hook_dirs"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/amulet/rocksdb/_version.py"
versionfile_build = "rocksdb/_version.py"
tag_prefix = ""
parentdir_prefix = "amulet_rocksdb-"

[tool.cibuildwheel]
test-sources = ["tests"]
test-command = "python -m unittest discover -s tests"

[tool.cibuildwheel.linux]
before-all = "yum install -y cmake"

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair --ignore-existing --exclude msvcp140.dll -w {dest_dir} -v {wheel}"
